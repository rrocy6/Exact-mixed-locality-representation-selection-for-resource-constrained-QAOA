config_version: "1.0-draft.2"
config_id: "experiment_config_v1_draft_2"
status: "draft_pending_pilot_and_approval"
created_date: "2026-08-27"
updated_date: "2026-08-27"

sources:
  benchmark_spec:
    path: "benchmark_spec_v1.md"
    version: "1.0-draft"
    sha256: "7ce13bdf2135fed2e34eddffeb2cde75ec25ee9c284adfd9177b63e487af78cb"
  instance_schema:
    path: "instance_schema/instance_schema_v1.json"
    version: "1.0-draft"
    sha256: "21c06ecf36855e12d1b86a31ded625cfceba8ae0004a83ecd74bb653172b675b"
  paper:
    path: "paper/main.tex"
    section: 7
    title: "Experimental Methodology"
    source_sha256: "33c48ab1ec316710c25f19d13b92134b9cd2e8c67a815061b148a2d1d579d351"
  execution_guide:
    path: "URSS_experiment_execution_guide_for_partner.pdf"
    sha256: "9f75d6db53b84e59e9bffd7e0b24ba64ef8ea7f1ab543d15693853feb32f1539"

benchmark:
  families:
    weighted_max3sat:
      weight_distribution:
        type: "discrete_uniform"
        values: [1, 2, 3, 4, 5]
      clause_density_targets:
        low: 2
        intermediate: 4
        high: 6
      proposal_modes: ["uniform", "anchor_pair"]
      require_distinct_variables_per_clause: true
      require_each_variable_used: true
    cubic_spin_glass:
      spin_to_boolean_convention: "s=1-2x"
      lower_order_terms:
        constant: 0
        linear: 0
        quadratic: 0
      cubic_coefficient_distribution:
        type: "rademacher"
        values: [-1, 1]
        probabilities: [0.5, 0.5]
      hyperedges_per_variable_targets:
        low: 1
        intermediate: 2
        high: 4
      proposal_modes: ["uniform", "anchor_pair"]
  primary_regime_axes:
    - "canonical_cubic_sparsity"
    - "pair_reuse"
    - "hardware_connectivity"
  diagnostic_only_axes:
    - "sign_balance"
    - "coefficient_heterogeneity"

dataset:
  tiers:
    oracle:
      n_values: [5, 6, 7, 8]
      max_canonical_cubic_terms: 8
      target_instances_per_family: 30
    qaoa:
      n_values: [6, 8, 10]
      target_instances_per_family: 36
      common_width_limit_qmax: null
      require_all_four_representations_within_qmax: true
    compilation:
      n_values: [8, 12, 16, 20]
      target_instances_per_family: 90
      supports_asymptotic_scaling_claims: false
    limited_noise:
      source_tier: "qaoa"
      target_instances_per_family: 9
      selection_policy: "predeclared_structural_coverage_before_results"
  split:
    train: 0.60
    validation: 0.20
    test: 0.20
    assignment_seed: 2026082703
    freeze_before_selector_or_qaoa_results: true
  generation:
    master_seed: 2026082701
    validation_seed: 2026082702
    large_instance_spot_checks: 1024
    deterministic_ids_required: true
    duplicate_raw_instances_forbidden: true

representations:
  compared:
    - "all_native"
    - "fully_quadratized"
    - "selective"
    - "matched_random_selective"
  fully_quadratized_pair_assignment_rule: "minimum_cardinality_pair_cover_with_lexicographic_pair_set_and_assignment_tie_break"
  fully_quadratized_pair_assignment_must_be_deterministic: true
  matched_random:
    match_on: "auxiliary_count"
    allowed_match_fields: ["auxiliary_count", "reduced_cubic_term_count"]
    seed_bundle: [2026082711, 2026082712, 2026082713, 2026082714, 2026082715]
    average_over_seed_bundle: true

penalty_tightness:
  settings: ["below_threshold", "at_threshold", "above_threshold"]
  below_threshold_delta: 1
  above_threshold_epsilon: 1
  require_unique_consistent_auxiliary_above_threshold: true

relaxation:
  primary_method: "SA_RLT_level_2"
  returns: ["single_moments_mu", "pair_moments_q"]
  solver:
    package: "scipy.optimize.linprog"
    method: "highs"
    scipy_version: "1.18.1"
    presolve: true
  independence_closure:
    enabled_only_as_ablation: true
    formula: "q_ij=mu_i*mu_j"

selector:
  weights: null
  feasibility_limits: null
  search_method: "deterministic_pareto_beam_then_anytime_branch_and_bound"
  search_settings:
    action_order: "native_then_lexicographic_constituent_pairs"
    beam_width: null
    beam_allocation:
      smallest_resource_score_fraction: 0.5
      nondominated_rank_and_crowding_fraction: 0.5
    final_tie_break: "lexicographic_action_vector"
    compiler_lower_bounds:
      two_qubit_gate_count: 0
      two_qubit_depth: 0
    certification:
      enabled_for_oracle: true
      max_complete_candidate_evaluations: null
      stop_on_certified_optimum: true
      wall_time_limit: "disabled_for_reproducibility"
  tune_on: ["train", "validation"]
  retune_on_test: false

compiler:
  software:
    qiskit_version: "2.4.2"
    qiskit_aer_version: "0.17.2"
  architectures:
    - id: "all_to_all_reference"
      coupling_map: "all_to_all"
    - id: "device_sparse_v1"
      coupling_map: null
  basis_gates: null
  synthesis_rules:
    coefficient_aggregation: "before_compilation"
    zero_removal: "exact_zero_only"
    logical_order: "original_indices_then_active_auxiliary_pairs_lexicographically"
    pauli_string_order: "increasing_weight_then_lexicographic"
    phase_gadget: "ancilla_free_cx_rz_cx_targeting_largest_index"
    cross_gadget_cancellation: false
    commutation_reordering: false
    approximate_angle_simplification: false
  optimization_level: null
  layout_method: null
  routing_method: null
  translation_method: null
  scheduling_method: null
  transpiler_seed_bundle: [2026082721, 2026082722, 2026082723, 2026082724, 2026082725]
  seed_aggregation_statistic: "median"
  metric_extraction_stage: "post_translation_post_routing_post_optimization"
  same_protocol_for_all_representations: true
  primary_metrics:
    - "two_qubit_gate_count"
    - "two_qubit_depth"
    - "swap_count"
    - "routing_overhead"

qaoa:
  primary_simulation: "noiseless_statevector"
  budget_modes: ["equal_layer", "equal_compiled_two_qubit_gates"]
  equal_layer_depths: []
  compiled_two_qubit_gate_budgets: []
  optimizer:
    name: null
    objective_evaluations: null
    restarts: null
    tolerance: null
    seed_bundle: [2026082731, 2026082732, 2026082733]
  parameter_initialization:
    rule: "seeded_uniform_independent_per_restart"
    gamma_interval: [0.0, 6.283185307179586]
    beta_interval: [0.0, 3.141592653589793]
  shots:
    noiseless_statevector: null
    sampled_or_noisy_runs: null
  circuit_seed_bundle: [2026082741, 2026082742, 2026082743]
  measurement_seed_bundle: [2026082751, 2026082752, 2026082753]
  optimize_each_representation_independently: true
  retain_all_restarts: true
  warm_start_policies:
    - "cold_start"
    - "original_variables_only"
    - "original_and_auxiliary_variables"
  warm_start:
    clipping_delta: null
    primary_auxiliary_marginals: "SA_RLT_level_2_pair_moments"
    independence_closure_is_ablation_only: true

noise:
  topology_id: "device_sparse_v1"
  model_id: null
  levels:
    - id: "noiseless"
      parameters: {}
    - id: "realistic_low"
      parameters: null
    - id: "realistic_high"
      parameters: null
  require_exactly_two_nonzero_levels: true
  same_protocol_for_all_representations: true

scoring:
  project_augmented_samples_to_original_bits: true
  primary_score: "original_family_objective"
  encoded_energy_is_diagnostic_only: true
  auxiliary_consistency_is_diagnostic_only: true
  paired_by_raw_instance: true

reporting:
  report_all_scheduled_runs: true
  report_failures_and_timeouts: true
  report_per_instance_rows: true
  report_uncertainty: true
  include_config_hash: true
  include_manifest_hash: true

freeze_gate:
  blocked: true
  required_before_freeze:
    - "dataset.tiers.qaoa.common_width_limit_qmax"
    - "selector.weights"
    - "selector.feasibility_limits"
    - "selector.search_settings.beam_width"
    - "selector.search_settings.certification.max_complete_candidate_evaluations"
    - "compiler.architectures.device_sparse_v1.coupling_map"
    - "compiler.basis_gates"
    - "compiler.optimization_level"
    - "compiler.layout_method"
    - "compiler.routing_method"
    - "compiler.translation_method"
    - "compiler.scheduling_method"
    - "qaoa.equal_layer_depths"
    - "qaoa.compiled_two_qubit_gate_budgets"
    - "qaoa.optimizer.name"
    - "qaoa.optimizer.objective_evaluations"
    - "qaoa.optimizer.restarts"
    - "qaoa.optimizer.tolerance"
    - "qaoa.shots.sampled_or_noisy_runs"
    - "qaoa.warm_start.clipping_delta"
    - "noise.model_id"
    - "noise.levels.realistic_low.parameters"
    - "noise.levels.realistic_high.parameters"
  approvals_required:
    - "benchmark_owner"
    - "code_owner"
    - "project_lead"
  pilot_required: true
