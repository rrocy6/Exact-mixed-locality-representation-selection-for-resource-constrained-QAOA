        type: discrete_uniform
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
      clause_density_targets:
        low: 2
        intermediate: 4
        high: 6
      proposal_modes:
      - uniform
      - anchor_pair
      require_distinct_variables_per_clause: true
      require_each_variable_used: true
    cubic_spin_glass:
      spin_to_boolean_convention: s=1-2x
      lower_order_terms:
        constant: 0
        linear: 0
        quadratic: 0
      cubic_coefficient_distribution:
        type: rademacher
        values:
        - -1
        - 1
        probabilities:
        - 0.5
        - 0.5
      hyperedges_per_variable_targets:
        low: 1
        intermediate: 2
        high: 4
      proposal_modes:
      - uniform
      - anchor_pair
  primary_regime_axes:
  - canonical_cubic_sparsity
  - pair_reuse
  - hardware_connectivity
  diagnostic_only_axes:
  - sign_balance
  - coefficient_heterogeneity
dataset:
