    validation_seed: 2026082702
    large_instance_spot_checks: 1024
    deterministic_ids_required: true
    duplicate_raw_instances_forbidden: true
representations:
  compared:
  - all_native
  - fully_quadratized
  - selective
  - matched_random_selective
  fully_quadratized_pair_assignment_rule: minimum_cardinality_pair_cover_with_lexicographic_pair_set_and_assignment_tie_break
  fully_quadratized_pair_assignment_must_be_deterministic: true
  matched_random:
    match_on: auxiliary_count
    allowed_match_fields:
    - auxiliary_count
    - reduced_cubic_term_count
    seed_bundle:
    - 2026082711
    - 2026082712
    - 2026082713
    - 2026082714
    - 2026082715
    average_over_seed_bundle: true
    sampling_rule: sha256_seeded_pair_set_then_augmenting_path_bipartite_matching_v2
    maximum_pair_set_attempts: 256
    fallback: selected_active_pair_set_randomized_assignment_then_selected_if_no_distinct_candidate
penalty_tightness:
  settings:
  - below_threshold
  - at_threshold
  - above_threshold
  below_threshold_delta: 1
  above_threshold_epsilon: 1
  require_unique_consistent_auxiliary_above_threshold: true
relaxation:
  primary_method: SA_RLT_level_2
  returns:
  - single_moments_mu
  - pair_moments_q
  solver:
    package: scipy.optimize.linprog
    method: highs
    scipy_version: 1.18.1
    presolve: true
  optimum_face_tie_break:
    enabled: true
    primary_optimum_tolerance: 1.0e-09
    secondary_objective: sha256_derived_positive_weights_v1
    declared_variable_order: singles_then_lexicographic_pairs_then_canonical_triples
    solver_stack_must_remain_pinned: true
  independence_closure:
    enabled_only_as_ablation: true
    formula: q_ij=mu_i*mu_j
selector:
  weights:
    auxiliary_count: 0.05
    two_qubit_gate_count: 0.45
    two_qubit_depth: 0.45
    maximum_penalty: 0.05
  fibre_risk:
    enabled: true
    definition: expected_penalized_fibre_excess_product_marginals_v1
    moment_source: deterministic_SA_RLT_level_2_primary_optimum_face
    expected_excess_formula: sum_p((q_p-mu_i*mu_j)*A_p(mu)+M_p*ell_p)
    rosenberg_expectation_formula: ell_p=mu_i*mu_j+q_p*(3-2*mu_i-2*mu_j)
    normalisation_formula: 4*sum_candidate_pairs(sum_incident_cubic_abs_coefficients+positive_penalty_margin)
    positive_penalty_margin: 1
    threshold_tau: 0.02
    guardrail_operator: less_than_or_equal
    include_as_pareto_coordinate: true
    native_value: 0
    numeric_tolerance: 1.0e-09
    independence_closure_role: ablation_only
  feasibility_limits:
    maximum_qubits: 12
    maximum_two_qubit_gates_per_cost_layer: 256
    maximum_two_qubit_depth_per_cost_layer: 192
    maximum_penalty: 128
  search_method: deterministic_pareto_beam_then_anytime_branch_and_bound
  search_settings:
    action_order: native_then_lexicographic_constituent_pairs
    beam_width: 64
    beam_allocation:
      smallest_resource_score_fraction: 0.5
      nondominated_rank_and_crowding_fraction: 0.5
    final_tie_break: lexicographic_action_vector
    no_feasible_design_fallback: all_native_if_hard_feasible_otherwise_fail
    endpoint_designs_remain_eligible: true
    compiler_lower_bounds:
      two_qubit_gate_count: 0
      two_qubit_depth: 0
    certification:
      enabled_for_oracle: true
      max_complete_candidate_evaluations: 65536
      stop_on_certified_optimum: true
      wall_time_limit: disabled_for_reproducibility
  tune_on:
  - train
  - validation
  retune_on_test: false
  scales:
    auxiliary_count: 6
    two_qubit_gate_count: 128
    two_qubit_depth: 96
    maximum_penalty: 64
